<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Panduan untuk Ibu</title>
<style>
  @font-face { font-family: 'PJS'; font-weight: 500; src: url(fonts/PJS-500Medium.ttf); }
  @font-face { font-family: 'PJS'; font-weight: 600; src: url(fonts/PJS-600SemiBold.ttf); }
  @font-face { font-family: 'PJS'; font-weight: 700; src: url(fonts/PJS-700Bold.ttf); }
  @font-face { font-family: 'PJS'; font-weight: 800; src: url(fonts/PJS-800ExtraBold.ttf); }
  :root { --ink: #2B2745; --muted: #6B6788; --violet: #7B66F0; --orange: #FF8A5B; --green: #2FB38A; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; font-family: 'PJS', 'DejaVu Sans', sans-serif; color: var(--ink); background: #FBF8FF; }
  #bg { position: absolute; inset: 0;
    background: radial-gradient(700px 700px at 10% 8%, #FFE6D8 0%, rgba(255,230,216,0) 70%), radial-gradient(800px 800px at 95% 60%, #E9E3FF 0%, rgba(233,227,255,0) 70%),
                radial-gradient(600px 600px at 15% 95%, #DDF5EA 0%, rgba(221,245,234,0) 70%), linear-gradient(180deg, #FBF8FF, #FFF7F2); }
  /* header */
  #head { position: absolute; left: 60px; right: 60px; top: 56px; height: 250px; display: flex; gap: 28px; align-items: center; }
  #badge { flex: none; width: 150px; height: 150px; border-radius: 44px; background: #fff; box-shadow: 0 14px 36px rgba(123,102,240,.18); display: flex; align-items: center; justify-content: center; font-size: 84px; }
  #brand { font-size: 24px; font-weight: 800; letter-spacing: 4px; text-transform: uppercase; color: var(--orange); }
  #title { font-size: 62px; font-weight: 800; letter-spacing: -1.5px; line-height: 1.05; margin-top: 8px; }
  #sub { font-size: 30px; font-weight: 500; color: var(--muted); margin-top: 10px; line-height: 1.3; }
  /* phone */
  #phoneWrap { position: absolute; left: 218px; top: 330px; width: 644px; height: 1348px; }
  .phone { width: 644px; height: 1348px; border-radius: 78px; background: #2B2745; padding: 18px; box-shadow: 0 50px 110px rgba(43,39,69,.28), 0 0 0 4px #4A4470 inset; }
  .screen { position: relative; width: 608px; height: 1312px; border-radius: 62px; overflow: hidden; background: #fff; }
  iframe { width: 390px; height: 842px; border: 0; transform: scale(1.559); transform-origin: 0 0; }
  #veil { position: absolute; inset: 0; background: #F7F5FF; opacity: 0; pointer-events: none; }
  /* caption */
  #cap { position: absolute; left: 50px; right: 50px; top: 1702px; height: 180px; background: #fff; border-radius: 40px; box-shadow: 0 16px 40px rgba(123,102,240,.16);
    display: flex; align-items: center; gap: 26px; padding: 0 38px; }
  #num { flex: none; width: 84px; height: 84px; border-radius: 26px; background: linear-gradient(135deg, var(--orange), #FFB36B); color: #fff; font-size: 46px; font-weight: 800;
    display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 22px rgba(255,138,91,.35); }
  #capText { font-size: 40px; font-weight: 700; line-height: 1.22; letter-spacing: -.3px; }
  /* finger, ring, stamp */
  #finger { position: absolute; left: 0; top: 0; width: 78px; height: 78px; margin: -39px 0 0 -39px; border-radius: 50%; z-index: 30; pointer-events: none;
    background: radial-gradient(circle at 40% 35%, #fff, #FFE9DD 55%, rgba(255,138,91,.65)); box-shadow: 0 8px 22px rgba(43,39,69,.3), 0 0 0 4px rgba(255,138,91,.65); }
  #finger i { position: absolute; inset: 0; border-radius: 50%; background: inherit; }
  #ring { position: absolute; border: 6px solid var(--orange); border-radius: 22px; box-shadow: 0 0 0 10px rgba(255,138,91,.22); pointer-events: none; z-index: 29; }
  #stamp { position: absolute; left: 50%; top: 1040px; transform: translateX(-50%); z-index: 32; background: var(--green); color: #fff; font-weight: 800; font-size: 50px;
    padding: 22px 46px; border-radius: 999px; box-shadow: 0 20px 48px rgba(47,179,138,.45); white-space: nowrap; }
  /* full-screen cards */
  #card { position: absolute; inset: 0; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: #fff; padding: 0 90px; }
  #card .em { font-size: 210px; line-height: 1; }
  #card .k { font-size: 30px; font-weight: 800; letter-spacing: 7px; text-transform: uppercase; opacity: .9; margin-top: 40px; }
  #card .t { font-size: 92px; font-weight: 800; line-height: 1.04; letter-spacing: -2px; margin-top: 16px; }
  #card .s { font-size: 40px; font-weight: 600; line-height: 1.32; margin-top: 30px; opacity: .96; }
  #card .brand { position: absolute; bottom: 90px; left: 0; right: 0; font-size: 34px; font-weight: 800; opacity: .9; }
  #card .nuri { width: 260px; height: 260px; }
  .confetti { position: absolute; width: 18px; height: 26px; border-radius: 5px; z-index: 60; pointer-events: none; }
</style>
</head>
<body>
  <div id="bg"></div>
  <div id="head"><div id="badge"></div><div><div id="brand">🌱 NutriSense · Panduan Ibu</div><div id="title"></div><div id="sub"></div></div></div>
  <div id="phoneWrap"><div class="phone"><div class="screen"><iframe name="app" src="about:blank"></iframe><div id="veil"></div></div></div></div>
  <div id="cap"><div id="num">1</div><div id="capText"></div></div>
  <div id="ring"></div>
  <div id="finger"><i></i></div>
  <div id="stamp"></div>
  <div id="card"></div>
<script src="gsap.min.js"></script>
<script>
  const S = Number(new URLSearchParams(location.search).get('slow') || 1);
  gsap.globalTimeline.timeScale(1 / S);
  const $ = (id) => document.getElementById(id);
  const nuriSvg = `<svg class="nuri" viewBox="0 0 100 100" style="overflow:visible">
    <path d="M50 30 C50 22 50 18 50 14" stroke="#2FB38A" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M50 18 C40 6 26 10 26 18 C34 24 44 22 50 18 Z" fill="#46C89E"/><path d="M50 16 C58 2 76 6 76 14 C68 22 57 21 50 16 Z" fill="#2FB38A"/>
    <ellipse cx="50" cy="62" rx="34" ry="31" fill="#FFD6BF"/><ellipse cx="50" cy="68" rx="24" ry="18" fill="#FFE6D6"/>
    <circle cx="30" cy="68" r="6" fill="#FF9E9E" opacity=".7"/><circle cx="70" cy="68" r="6" fill="#FF9E9E" opacity=".7"/>
    <circle cx="39" cy="58" r="4.5" fill="#3B2F3A"/><circle cx="61" cy="58" r="4.5" fill="#3B2F3A"/><circle cx="40.5" cy="56.4" r="1.5" fill="#fff"/><circle cx="62.5" cy="56.4" r="1.5" fill="#fff"/>
    <path d="M41 69 Q50 80 59 69 Z" fill="#E0564A" stroke="#3B2F3A" stroke-width="2.2" stroke-linejoin="round"/></svg>`;

  gsap.set(['#ring', '#finger', '#stamp', '#cap > *'], { autoAlpha: 0 });
  gsap.to('#phoneWrap', { y: -6, duration: 3.4, ease: 'sine.inOut', yoyo: true, repeat: -1 });

  window.setHead = (em, title, sub) => { $('badge').textContent = em; $('title').textContent = title; $('sub').textContent = sub; };
  let n = 0;
  window.cap = (text, num = true) => {
    if (num) n += 1;
    gsap.timeline()
      .to('#cap > *', { autoAlpha: 0, y: -14, duration: 0.25, ease: 'power2.in' })
      .add(() => { $('num').textContent = num ? n : '✓'; $('capText').textContent = text; })
      .fromTo('#cap > *', { autoAlpha: 0, y: 18 }, { autoAlpha: 1, y: 0, duration: 0.5, stagger: 0.06, ease: 'back.out(1.6)' })
      .fromTo('#num', { scale: 0.5 }, { scale: 1, duration: 0.6, ease: 'elastic.out(1, 0.5)' }, '<');
  };
  window.veil = (v) => gsap.to('#veil', { opacity: v ? 1 : 0, duration: v ? 0.25 : 0.45 });
  window.finger = (x, y, ms = 520) => { gsap.to('#finger', { autoAlpha: 1, duration: 0.2 }); gsap.to('#finger', { x, y, duration: ms / 1000, ease: 'power3.inOut', overwrite: 'auto' }); };
  window.fingerHide = () => gsap.to('#finger', { autoAlpha: 0, duration: 0.3 });
  window.press = () => gsap.fromTo('#finger i', { scale: 1 }, { scale: 0.7, duration: 0.12, yoyo: true, repeat: 1 });
  window.ring = (b) => {
    if (!b) { gsap.to('#ring', { autoAlpha: 0, duration: 0.25 }); return; }
    gsap.set('#ring', { left: b.x - 10, top: b.y - 10, width: b.width + 20, height: b.height + 20 });
    gsap.fromTo('#ring', { autoAlpha: 0, scale: 1.12 }, { autoAlpha: 1, scale: 1, duration: 0.35, ease: 'back.out(2)' });
  };
  const PAL = ['#FF8A5B', '#7B66F0', '#2FB38A', '#FFC857', '#FF6FA0', '#46C89E'];
  window.confetti = (x = 540, y = 960, k = 70) => {
    for (let i = 0; i < k; i++) {
      const c = document.createElement('div'); c.className = 'confetti'; c.style.background = PAL[i % PAL.length]; document.body.appendChild(c);
      gsap.set(c, { left: x, top: y, rotation: Math.random() * 360, scale: 0.6 + Math.random() * 0.8 });
      gsap.timeline({ onComplete: () => c.remove() })
        .to(c, { x: 'random(-460, 460)', y: 'random(-460, -140)', rotation: 'random(-540, 540)', duration: 0.9, ease: 'power3.out' })
        .to(c, { y: '+=900', rotation: '+=random(-360, 360)', autoAlpha: 0, duration: 1.7, ease: 'power1.in' });
    }
  };
  window.success = (text) => {
    $('stamp').textContent = text;
    gsap.timeline().fromTo('#stamp', { autoAlpha: 0, scale: 2, rotation: -12 }, { autoAlpha: 1, scale: 1, rotation: -5, duration: 0.55, ease: 'back.out(2.2)' })
      .to('#stamp', { autoAlpha: 0, y: -40, duration: 0.5, delay: 1.5 }).set('#stamp', { y: 0 });
    window.confetti(540, 1080, 60);
  };
  // Full-screen cards (intro, outro). The opening card is already up, so the app never shows before the intro.
  const card = $('card');
  window.card = (html, color, conf = false) => {
    card.style.background = `radial-gradient(900px 900px at 50% 40%, rgba(255,255,255,.22), rgba(255,255,255,0) 70%), ${color}`;
    card.innerHTML = html;
    const tl = gsap.timeline();
    if (gsap.getProperty(card, 'autoAlpha') < 0.5) tl.set(card, { autoAlpha: 1, clipPath: 'circle(0% at 50% 50%)' }).to(card, { clipPath: 'circle(80% at 50% 50%)', duration: 0.8, ease: 'power3.inOut' });
    tl.from(card.children, { y: 50, autoAlpha: 0, scale: 0.92, duration: 0.7, stagger: 0.1, ease: 'back.out(1.6)' }, '-=0.2');
    const nu = card.querySelector('.nuri'); if (nu) gsap.to(nu, { y: -16, duration: 0.9, yoyo: true, repeat: -1, ease: 'sine.inOut' });
    if (conf) tl.add(() => window.confetti(540, 900, 90), 0.5);
  };
  window.cardHide = () => gsap.to(card, { clipPath: 'circle(0% at 50% 50%)', duration: 0.75, ease: 'power3.inOut', onComplete: () => gsap.set(card, { autoAlpha: 0 }) });
  window.nuri = () => nuriSvg;
  card.style.background = '#7B66F0'; gsap.set(card, { autoAlpha: 1, clipPath: 'circle(80% at 50% 50%)' });
</script>
</body>
</html>
