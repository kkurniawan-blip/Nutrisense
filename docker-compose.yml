# Backend + PostgreSQL. Run: docker compose up --build   (API on http://localhost:8000/docs)
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: nutrisense
      POSTGRES_PASSWORD: nutrisense
      POSTGRES_DB: nutrisense
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nutrisense"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      NUTRISENSE_DATABASE_URL: postgresql+psycopg2://nutrisense:nutrisense@db:5432/nutrisense
    ports:
      - "8000:8000"
    volumes:
      - models:/app/model_store
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  models:
